<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Hábita - Reservá tu turno</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Hábita - Cuerpo, energía y alma. Masajes, drenaje linfático, tratamiento estético y Reiki en Lagomar Sur.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500;600&display=swap">
<style>
/* Una sola columna pensada para el celular: cabecera con el loto, reglas, tres pasos (servicio, día y hora, datos). Panel privado para la dueña. */
:root{
  --bg:#EFE5D8; --surface:#F8F2E9; --soft:#E7DACA; --ink:#43342C; --muted:#75624F; --line:#D8C8B5;
  --sage:#8A9A78; --sage-ink:#566746; --on-sage:#232C1A;
  --terra:#A65F39; --terra-text:#8F4E2B; --terra-ink:#FBF6EE;
  --lilac-ink:#7C5575; --warn:#9A3F2E; --ok:#4A6A3E;
  --serif:'Cormorant Garamond',Georgia,serif; --sans:'Jost',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#241C18; --surface:#2F2521; --soft:#3A2E28; --ink:#F0E6D9; --muted:#BFAC9C; --line:#4B3C34;
  --sage:#A3B38F; --sage-ink:#B7C6A4; --on-sage:#1E2515;
  --terra:#D58E66; --terra-text:#E6A583; --terra-ink:#2A1F1A;
  --lilac-ink:#D6B3CF; --warn:#E69C88; --ok:#ABC99C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#241C18; --surface:#2F2521; --soft:#3A2E28; --ink:#F0E6D9; --muted:#BFAC9C; --line:#4B3C34;
  --sage:#A3B38F; --sage-ink:#B7C6A4; --on-sage:#1E2515;
  --terra:#D58E66; --terra-text:#E6A583; --terra-ink:#2A1F1A;
  --lilac-ink:#D6B3CF; --warn:#E69C88; --ok:#ABC99C; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--sans);margin:0;
  padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:500;margin:0;text-wrap:balance}
:focus-visible{outline:2px solid var(--terra);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.wrap.wide{max-width:780px;gap:16px}
.brand{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.brand svg{width:128px;height:auto;max-width:100%}
.brand h1{font-size:clamp(40px,13vw,58px);letter-spacing:.07em;line-height:1;text-transform:uppercase;color:var(--sage-ink);font-weight:500}
.tag{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--terra-text);font-weight:500}
.lead{text-align:center;color:var(--muted);margin:0}
.rules{display:grid;gap:10px;margin:0;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.rules div{display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px;font-size:14px}
.rules dt{font-weight:600;color:var(--sage-ink)}
.rules dd{margin:0;color:var(--muted)}
.step{display:flex;flex-direction:column;gap:12px;scroll-margin-top:12px}
.step[data-locked="1"]{opacity:.45;pointer-events:none}
.sh{display:flex;align-items:center;gap:10px}
.sh h2{font-size:32px;line-height:1.1}
.hint{margin:-6px 0 0;font-size:14px;color:var(--muted)}
.num{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--terra);color:var(--terra-text);display:grid;place-items:center;font-size:14px;font-weight:600;flex:none}
.step[data-done="1"] .num{background:var(--terra);color:var(--terra-ink)}
.svc{display:grid;gap:8px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;min-height:54px;background:var(--surface);border:1px solid var(--line);border-radius:14px;cursor:pointer}
.opt small{color:var(--muted);white-space:nowrap}
.opt[aria-pressed="true"]{border-color:var(--terra);box-shadow:inset 0 0 0 1px var(--terra);background:var(--soft)}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.calh strong{font-family:var(--serif);font-size:24px;font-weight:600;text-transform:capitalize}
.iconb{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:18px;line-height:1}
.iconb:disabled{opacity:.3;cursor:default}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{font-size:12px;text-align:center;color:var(--muted);padding:4px 0}
.day{aspect-ratio:1;min-height:40px;border:0;border-radius:10px;background:transparent;cursor:pointer;font-size:15px;font-variant-numeric:tabular-nums}
.day:disabled{opacity:.27;cursor:default}
.day[data-today="1"]{box-shadow:inset 0 0 0 1px var(--sage)}
.day[aria-pressed="true"]{background:var(--terra);color:var(--terra-ink);font-weight:600}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.slot{padding:11px 0;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-variant-numeric:tabular-nums}
.slot[aria-pressed="true"]{background:var(--terra);border-color:var(--terra);color:var(--terra-ink);font-weight:600}
.slot.busy{background:transparent;border-style:dashed;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:0;padding:7px 0;line-height:1.2}
.slot.busy s{text-decoration:line-through;text-decoration-thickness:1.5px}
.slot.busy span{font-size:11px}
.slot.busy[aria-pressed="true"]{background:var(--soft);border-style:solid;border-color:var(--terra);color:var(--ink);font-weight:500}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px;min-height:46px;width:100%;min-width:0}
input[type=checkbox]{width:20px;height:20px;min-height:0;accent-color:var(--terra)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:8px;min-height:50px;padding:0 22px;border-radius:999px;border:0;background:var(--terra);color:var(--terra-ink);font-weight:600;font-size:16px;text-decoration:none;cursor:pointer;text-align:center}
.btn[aria-disabled="true"],.btn:disabled{opacity:.4;pointer-events:none}
.btn.ghost{background:transparent;color:var(--terra-text);border:1px solid var(--terra)}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px}
.btn.plain{background:transparent;color:var(--muted);text-decoration:underline;min-height:34px;padding:0 8px;font-weight:500;font-size:14px}
.note{padding:12px 14px;border-radius:12px;background:var(--soft);font-size:14px;margin:0}
.small{font-size:13px;color:var(--muted)}
.sum{display:grid;gap:2px;padding:14px 16px;border-radius:14px;border:1px dashed var(--sage)}
.sum b{font-family:var(--serif);font-size:22px;font-weight:600}
.foot{text-align:center;font-size:13px;color:var(--muted);margin:0;display:flex;flex-direction:column;gap:4px}
.foot p{margin:0}
.foot a{color:var(--terra-text);font-weight:500}
.sug{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.sugi{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;min-height:46px;padding:10px 14px;background:transparent;border:0;border-top:1px solid var(--line);cursor:pointer;text-align:left}
.sugi:first-child{border-top:0}
.sugi span{color:var(--muted);font-size:13px;white-space:nowrap}
.sugi:hover{background:var(--soft)}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.kv:first-of-type{border-top:0}
.kv b{font-variant-numeric:tabular-nums;white-space:nowrap}
.kv.tot{font-family:var(--serif);font-size:22px}
.kv.tot b{font-weight:600}
details.cancel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 16px}
details.cancel summary{cursor:pointer;min-height:46px;display:flex;align-items:center;font-weight:500}
details.cancel .in{display:flex;flex-direction:column;gap:12px;padding:4px 0 16px}
.bar{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:14px}
.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:6px}
.tab{padding:10px 2px;border-radius:999px;border:1px solid var(--line);background:transparent;cursor:pointer;font-weight:500;font-size:14px}
.tab[aria-pressed="true"]{background:var(--sage);border-color:var(--sage);color:var(--on-sage)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h3{font-size:22px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.row>div{min-width:0}
.item{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.item:first-of-type,.dayh+.item{border-top:0;padding-top:0}
.time{font-variant-numeric:tabular-nums;font-weight:600;display:inline-block;min-width:52px}
.chip{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid currentColor;white-space:nowrap}
.chip.pend{color:var(--warn)} .chip.conf,.chip.done{color:var(--ok)} .chip.canc,.chip.cobr{color:var(--muted)} .chip.cup{color:var(--lilac-ink)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.chk{display:inline-flex;gap:8px;align-items:center;font-size:14px}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.bar-prog{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar-prog i{display:block;height:100%;background:var(--sage)}
.dayh{font-family:var(--serif);font-size:20px;text-transform:capitalize;margin-top:4px}
.opt.big{flex-direction:column;align-items:stretch;gap:4px}
.opt .top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.opt .desc{font-size:13px;line-height:1.45;color:var(--muted)}
.day[data-full="1"]{text-decoration:line-through;opacity:.62}
.legend{font-size:13px;color:var(--muted);margin:8px 2px 0}
.badge{display:inline-block;min-width:18px;height:18px;border-radius:9px;background:var(--terra);color:var(--terra-ink);font-size:11px;line-height:18px;padding:0 5px;margin-left:4px;font-weight:600}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90vw;text-align:center}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
'use strict';
const SERVICES=[
  {id:'desc',name:'Masaje descontracturante',dur:60,price:1000,desc:'Masaje profundo que busca aliviar las dolencias de las contracturas. Incluye espalda, hombros, cuello, manos, piernas y pies, además de terapia de ventosas y piedras calientes.'},
  {id:'rel',name:'Masaje relajante',dur:60,price:1000,desc:'Masaje más superficial que busca relajarte e inducirte a un estado de paz y calma. Se trabaja en espalda, hombros, cuello, manos, piernas y pies. Incluye piedras calientes.'},
  {id:'emb',name:'Masaje para embarazadas',dur:90,price:1500,desc:'Masaje en silla y en camilla, pensado especialmente para gestantes. Masaje suave en espalda, cuello, piernas, brazos y rostro.'},
  {id:'dren',name:'Masaje de drenaje linfático',dur:60,price:1000,desc:'Técnica basada en movimientos suaves, lentos y rítmicos realizados con las manos para estimular el sistema linfático.'},
  {id:'est',name:'Tratamiento estético',dur:60,price:1000,desc:'Fusión de aparatología estética y drenaje linfático manual para lograr tu meta. Incluye electrodos, vacuum, termoterapia, radiofrecuencia y cavitador.'},
  {id:'reiki',name:'Reiki Usui',dur:60,price:1000,desc:'Terapia de medicina alternativa y complementaria. Canalización de la energía vital universal para armonizar el cuerpo, la mente y el alma.'}
];
const PREFS={any:'Cualquier horario',am:'Por la mañana',pm:'Por la tarde'};
const PACKS=[
  {id:'p5',label:'5 sesiones',total:5,price:4000,only:''},
  {id:'p10',label:'10 sesiones',total:10,price:7500,only:''},
  {id:'p4e',label:'4 sesiones de masaje para embarazadas',total:4,price:5000,only:'emb'}
];
const IG='https://www.instagram.com/habita_terapias';
const money=n=>'$'+String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const durTxt=m=>m===60?'1 hora':m===90?'1 hora 30':m+' min';
const svcOf=id=>SERVICES.find(s=>s.id===id)||{dur:60,price:1000,name:''};
const dur=id=>svcOf(id).dur;
const curDur=()=>S.svc?dur(S.svc):60;
const DAYS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MONTHS=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

const $=s=>document.querySelector(s);
const app=$('#app');
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseD=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
const mins=t=>{const p=t.split(':').map(Number);return p[0]*60+p[1]};
const hhmm=n=>pad(Math.floor(n/60))+':'+pad(n%60);
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDay=s=>{const d=parseD(s);return DAYS[d.getDay()]+' '+d.getDate()+'/'+pad(d.getMonth()+1)};
const svcName=id=>(SERVICES.find(s=>s.id===id)||{name:''}).name;
const TIMES=[];for(let m=8*60;m<=20*60;m+=30)TIMES.push(hhmm(m));
const TIMES_X=[];for(let m=7*60;m<=22*60;m+=30)TIMES_X.push(hhmm(m));
const wa=(num,text)=>'https://wa.me/'+(num||'')+'?text='+encodeURIComponent(text);
function waPhone(p){const d=String(p||'').replace(/\D/g,'');if(!d)return '';if(d.indexOf('598')===0)return d;if(d[0]==='0')return '598'+d.slice(1);return '598'+d}
const first=n=>String(n||'').trim().split(/\s+/)[0];
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');


const lotus=()=>'<svg viewBox="350 170 480 365" role="img" aria-label="Flor de loto de Hábita"><path fill="#C193B9" d="M438 296C490 305 520 322 545 345L548 455C480 440 440 380 438 296Z"/><path fill="#C193B9" d="M742 296C690 305 660 322 635 345L632 455C700 440 740 380 742 296Z"/><path fill="#C27F6C" d="M355 396C420 385 500 392 548 450C565 470 580 495 590 518C510 535 400 520 355 396Z"/><path fill="#C27F6C" d="M825 396C760 385 680 392 632 450C615 470 600 495 590 518C670 535 780 520 825 396Z"/><path fill="#AE6A43" d="M590 250C560 285 535 335 535 385C535 440 560 485 590 518C620 485 645 440 645 385C645 335 620 285 590 250Z"/><circle cx="590" cy="212" r="37" fill="#AE6A43"/></svg>';

const WA='59894757659';
const today0=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const S={svc:null,day:null,time:null,month:new Date(today0().getFullYear(),today0().getMonth(),1),
  form:{name:'',phone:'',kind:'suelta',note:'',weeks:'',first:'',health:''},sent:false,
  cancel:{name:'',d:'',t:'10:00'},cancelOpen:false};
function rule(d){const w=d.getDay();if(w===0||w===6)return null;return{first:8*60,close:(w===3||w===5)?19*60:20*60}}
function slotsFor(k,du){
  const d=parseD(k),r=rule(d);if(!r)return[];
  const now=new Date(),out=[];
  for(let s=r.first;s+du<=r.close;s+=30){
    const st=new Date(d.getFullYear(),d.getMonth(),d.getDate(),Math.floor(s/60),s%60);
    if(st<=now)continue;
    out.push(hhmm(s));
  }
  return out;
}
function dayOpen(k){
  const d=parseD(k),t0=today0();
  if(!rule(d)||d<t0||d>addDays(t0,90))return false;
  return slotsFor(k,curDur()).length>0;
}

function stepServicio(){
  return '<section class="step" id="s1" data-done="'+(S.svc?1:0)+'"><div class="sh"><span class="num">1</span><h2>¿Qué servicio querés agendar?</h2></div><p class="hint">Tocá el que quieras.</p><div class="svc">'+
  SERVICES.map(s=>'<button class="opt big" type="button" data-a="svc" data-v="'+s.id+'" aria-pressed="'+(S.svc===s.id)+'"><span class="top"><span>'+esc(s.name)+'</span><small>'+durTxt(s.dur)+' · '+money(s.price)+'</small></span>'+(s.desc?'<span class="desc">'+esc(s.desc)+'</span>':'')+'</button>').join('')+'</div></section>';
}
function stepDia(){
  const m=S.month,t0=today0(),maxD=addDays(t0,90);
  const lead=(new Date(m.getFullYear(),m.getMonth(),1).getDay()+6)%7;
  const dim=new Date(m.getFullYear(),m.getMonth()+1,0).getDate();
  let cells='';
  for(let i=0;i<lead;i++)cells+='<span></span>';
  for(let d=1;d<=dim;d++){
    const k=ymd(new Date(m.getFullYear(),m.getMonth(),d));
    cells+='<button class="day" type="button" data-a="day" data-v="'+k+'"'+(dayOpen(k)?'':' disabled')+' aria-pressed="'+(S.day===k)+'"'+(ymd(t0)===k?' data-today="1"':'')+'>'+d+'</button>';
  }
  const prevOk=m>new Date(t0.getFullYear(),t0.getMonth(),1);
  const nextOk=new Date(m.getFullYear(),m.getMonth()+1,1)<=maxD;
  let slots='';
  if(S.day){
    const hs=slotsFor(S.day,curDur());
    slots='<div id="slots" style="scroll-margin-top:12px"><p class="dayh">'+esc(fmtDay(S.day))+'</p>'+
      (hs.length?'<div class="slots">'+hs.map(h=>'<button class="slot" type="button" data-a="time" data-v="'+h+'" aria-pressed="'+(S.time===h)+'">'+h+'</button>').join('')+'</div>':'<p class="note">No quedan horarios ese día. Probá con otro.</p>')+
      '<p class="legend">Elegí el horario que más te guste. Yo te confirmo la disponibilidad por WhatsApp.</p></div>';
  }
  return '<section class="step" id="s2" data-locked="'+(S.svc?0:1)+'" data-done="'+(S.time?1:0)+'"><div class="sh"><span class="num">2</span><h2>¿Qué día y a qué hora?</h2></div><p class="hint">Tocá un día y después un horario.</p>'+
  '<div class="cal"><div class="calh"><button class="iconb" type="button" data-a="mon" data-v="-1" aria-label="Mes anterior"'+(prevOk?'':' disabled')+'>‹</button><strong>'+MONTHS[m.getMonth()]+' '+m.getFullYear()+'</strong><button class="iconb" type="button" data-a="mon" data-v="1" aria-label="Mes siguiente"'+(nextOk?'':' disabled')+'>›</button></div>'+
  '<div class="grid7">'+['L','M','M','J','V','S','D'].map(x=>'<span class="wd">'+x+'</span>').join('')+cells+'</div></div>'+slots+'</section>';
}
function reqMsg(){
  const f=S.form;
  return ['Hola! Quiero pedir un turno en Hábita.','Sesión: '+svcName(S.svc),'Día y hora que me gustaría: '+fmtDay(S.day)+', '+S.time+' ('+durTxt(curDur())+')','Nombre y apellido: '+f.name.trim(),'WhatsApp: '+f.phone.trim(),
    f.kind==='cup'?'Tengo cuponera.':'Sesión individual ('+money(svcOf(S.svc).price)+'): voy a transferir la seña del 50% ('+money(Math.round(svcOf(S.svc).price/2))+') a la cuenta Midinero Nº 1346663, a nombre de María Mercedes Souto, y te mando el comprobante.',
    f.first==='si'?'Es mi primera vez en Hábita.':f.first==='no'?'Ya vine antes.':'',
    f.first==='si'&&f.health.trim()?'Salud: '+f.health.trim():'',
    S.svc==='emb'&&f.weeks.trim()?'Semanas de embarazo: '+f.weeks.trim():'',
    f.note.trim()?'Nota: '+f.note.trim():'',
    'Quedo atenta a tu confirmación.'].filter(Boolean).join('\n');
}
function ctaState(){const f=S.form;const ok=f.name.trim().split(/\s+/).length>=2&&f.phone.replace(/\D/g,'').length>=8&&S.svc&&S.day&&S.time;return{ok:!!ok,href:ok?wa(WA,reqMsg()):'#'}}
function stepDatos(){
  const f=S.form,locked=!S.time;
  if(S.sent&&!locked){
    return '<section class="step" id="s3" data-done="1"><div class="sh"><span class="num">3</span><h2>Enviá tu pedido</h2></div>'+
    '<div class="sum"><b>'+esc(svcName(S.svc))+'</b><span>'+esc(fmtDay(S.day))+' a las '+S.time+' · '+durTxt(curDur())+'</span></div>'+
    '<p class="note">Enviá el mensaje que se armó en WhatsApp. Tu turno queda reservado cuando yo te lo confirme por ahí'+(f.kind==='suelta'?' y se acredite la seña':'')+'. Si ese horario no está disponible, te propongo otro.</p>'+
    '<a class="btn" href="'+esc(ctaState().href)+'" target="_blank" rel="noopener">Abrir WhatsApp de nuevo</a>'+
    '<button class="btn plain" type="button" data-a="reset">Hacer otro pedido</button></section>';
  }
  const c=ctaState();
  return '<section class="step" id="s3" data-locked="'+(locked?1:0)+'"><div class="sh"><span class="num">3</span><h2>Tus datos</h2></div>'+
  (S.time?'<div class="sum"><b>'+esc(svcName(S.svc))+'</b><span>'+esc(fmtDay(S.day))+' a las '+S.time+' · '+durTxt(curDur())+'</span></div>':'')+
  '<div class="seg"><button class="opt" type="button" data-a="kind" data-v="suelta" aria-pressed="'+(f.kind==='suelta')+'">Sesión individual</button><button class="opt" type="button" data-a="kind" data-v="cup" aria-pressed="'+(f.kind==='cup')+'">Tengo cuponera</button></div>'+
  '<p class="note">'+(f.kind==='suelta'?'Para confirmar el turno se abona una seña del 50% ('+money(Math.round(svcOf(S.svc).price/2))+'). Los datos para transferirla van en el mensaje que se arma al pedir el turno.':'No hace falta seña. Te aviso qué sesión de tu cuponera es.')+'</p>'+
  '<label class="field">Nombre y apellido<input id="f-name" data-g="f" data-k="name" autocomplete="name" value="'+esc(f.name)+'"></label>'+
  '<label class="field">WhatsApp<input id="f-phone" data-g="f" data-k="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="09X XXX XXX" value="'+esc(f.phone)+'"></label>'+
  '<div class="field">¿Es tu primera vez en Hábita?<div class="seg"><button class="opt" type="button" data-a="first" data-v="si" aria-pressed="'+(f.first==='si')+'">Sí</button><button class="opt" type="button" data-a="first" data-v="no" aria-pressed="'+(f.first==='no')+'">Ya vine antes</button></div></div>'+
  (f.first==='si'?'<label class="field">Lesiones, alergias o condiciones médicas que deba saber (opcional)<input id="f-health" data-g="f" data-k="health" value="'+esc(f.health)+'"></label>':'')+
  (S.svc==='emb'?'<label class="field">Semanas de embarazo (opcional)<input id="f-weeks" data-g="f" data-k="weeks" inputmode="numeric" value="'+esc(f.weeks)+'"></label>':'')+
  '<label class="field">Algo que quieras contarme, o otro horario que te sirva (opcional)<input id="f-note" data-g="f" data-k="note" value="'+esc(f.note)+'"></label>'+
  '<p class="small" id="nmhint" style="margin:0"'+(f.name.trim()&&f.name.trim().split(/\s+/).length<2?'':' hidden')+'>Escribí tu nombre y apellido.</p>'+'<a class="btn" id="cta" href="'+esc(c.href)+'" target="_blank" rel="noopener" data-a="sent" aria-disabled="'+(c.ok?'false':'true')+'">Pedir turno por WhatsApp</a>'+
  '<p class="small" style="margin:0;text-align:center">Se abre WhatsApp con el pedido ya escrito.</p></section>';
}
function cancelState(){
  const c=S.cancel;let msg='',ok=false;
  if(c.d&&c.t){
    const p=c.d.split('-').map(Number),h=c.t.split(':').map(Number);
    const hrs=(new Date(p[0],p[1]-1,p[2],h[0],h[1])-new Date())/36e5;
    if(hrs<=0)msg='Ese turno ya pasó.';
    else if(hrs>=24){msg='Cancelás con más de 24 horas de anticipación: sin costo.';ok=true}
    else{msg='Faltan menos de 24 horas: según la política, se cobra la sesión.';ok=true}
  }
  ok=ok&&c.name.trim().split(/\s+/).length>=2;
  const text='Hola! Quiero cancelar mi turno de Hábita del '+(c.d?fmtDay(c.d):'')+' a las '+c.t+'. Soy '+c.name.trim()+'.';
  return{msg,ok,href:ok?wa(WA,text):'#'};
}
function cancelBox(){
  const c=S.cancel,st=cancelState();
  return '<details class="cancel" id="cdet"'+(S.cancelOpen?' open':'')+'><summary>¿Necesitás cancelar un turno?</summary><div class="in">'+
  '<label class="field">Nombre y apellido<input id="c-name" data-g="c" data-k="name" autocomplete="name" value="'+esc(c.name)+'"></label>'+
  '<div class="formgrid"><label class="field">Día del turno<input id="c-d" data-g="c" data-k="d" type="date" min="'+ymd(new Date())+'" value="'+esc(c.d)+'"></label>'+
  '<label class="field">Hora<select id="c-t" data-g="c" data-k="t">'+TIMES_X.map(h=>'<option'+(h===c.t?' selected':'')+'>'+h+'</option>').join('')+'</select></label></div>'+
  '<p class="note" id="cmsg"'+(st.msg?'':' hidden')+'>'+esc(st.msg)+'</p>'+
  '<a class="btn ghost" id="ccta" href="'+esc(st.href)+'" target="_blank" rel="noopener" aria-disabled="'+(st.ok?'false':'true')+'">Avisar por WhatsApp</a></div></details>';
}
function view(){
  return '<div class="wrap"><header class="brand">'+lotus()+'<h1>Hábita</h1><div class="tag">Cuerpo, energía y alma</div></header>'+
  '<p class="lead"><b style="font-family:var(--serif);font-weight:500;font-size:24px;color:var(--ink);display:block;line-height:1.2;margin-bottom:6px">Bienvenida a Hábita</b>Acá podés reservar tu momento de cuidado. Elegí tu sesión, el día y el horario que te gustaría, y yo te confirmo por WhatsApp.</p>'+
  '<a class="btn" style="align-self:stretch;flex-direction:column;gap:2px;padding:10px 22px;border-radius:22px;line-height:1.25" href="'+esc(wa(WA,'Hola! Tengo una consulta sobre Hábita.'))+'" target="_blank" rel="noopener"><span>¿Tenés alguna consulta?</span><span style="font-weight:500;font-size:14px">Escribime por WhatsApp, yo ando por acá</span></a>'+
  '<dl class="rules">'+
    '<div><dt>Precio</dt><dd>Sesión individual: '+money(1000)+'. Masaje para embarazadas: '+money(1500)+'.</dd></div>'+
    '<div><dt>Seña</dt><dd>Las sesiones individuales se confirman con una seña del 50% ('+money(500)+'; '+money(750)+' en el masaje para embarazadas). Con cuponera no hace falta.</dd></div>'+
    '<div><dt>Cancelación</dt><dd>Podés cancelar o cambiar tu turno sin costo hasta 24 horas antes. De lo contrario se cobra la sesión.</dd></div>'+
    '<div><dt>Cuponeras</dt><dd>'+PACKS.map(x=>x.label+': '+money(x.price)).join(' · ')+'. Consultá por promos activas. En cada turno te aviso qué sesión de tu cuponera es.</dd></div>'+
  '</dl>'+stepServicio()+stepDia()+stepDatos()+cancelBox()+
  '<footer class="foot"><p>Atiendo de lunes a viernes, de 8:00 a 20:00 (miércoles y viernes hasta las 19:00).</p><p>Estoy en Lagomar Sur.</p><p><a href="'+IG+'" target="_blank" rel="noopener">@habita_terapias en Instagram</a></p></footer></div>';
}
function render(keep){
  const y=window.scrollY;
  app.innerHTML=view();
  if(keep)window.scrollTo(0,y);
}
function updCta(){const c=ctaState(),a=$('#cta');const h=$('#nmhint');if(h)h.hidden=S.form.name.trim().split(/\s+/).length>=2||!S.form.name.trim();if(a){a.href=c.href;a.setAttribute('aria-disabled',c.ok?'false':'true')}}
function updCancel(){const st=cancelState(),m=$('#cmsg'),a=$('#ccta');if(m){m.hidden=!st.msg;m.textContent=st.msg}if(a){a.href=st.href;a.setAttribute('aria-disabled',st.ok?'false':'true')}}
const G={f:S.form,c:S.cancel};
function onField(e){
  const t=e.target,g=t.getAttribute&&t.getAttribute('data-g');
  if(!g)return;
  G[g][t.getAttribute('data-k')]=t.value;
  if(g==='f')updCta();else updCancel();
}
app.addEventListener('input',onField);
app.addEventListener('change',onField);
app.addEventListener('toggle',e=>{if(e.target.id==='cdet')S.cancelOpen=e.target.open},true);
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.getAttribute('data-a'),v=b.getAttribute('data-v');
  if(a==='svc'){
    S.svc=v;
    if(S.day&&!dayOpen(S.day)){S.day=null;S.time=null}
    else if(S.time&&slotsFor(S.day,curDur()).indexOf(S.time)<0)S.time=null;
    S.sent=false;render(true);
    const s2=$('#s2');if(s2&&s2.scrollIntoView)s2.scrollIntoView({behavior:'smooth',block:'start'});
  }else if(a==='mon'){S.month=new Date(S.month.getFullYear(),S.month.getMonth()+Number(v),1);render(true)}
  else if(a==='day'){S.day=v;S.time=null;S.sent=false;render(true);const sl=$('#slots');if(sl&&sl.scrollIntoView)sl.scrollIntoView({behavior:'smooth',block:'nearest'})}
  else if(a==='time'){S.time=v;S.sent=false;render(true);const s3=$('#s3');if(s3&&s3.scrollIntoView)s3.scrollIntoView({behavior:'smooth',block:'start'})}
  else if(a==='kind'){S.form.kind=v;render(true)}
  else if(a==='first'){S.form.first=v;render(true)}
  else if(a==='sent'){if(b.getAttribute('aria-disabled')==='true'){e.preventDefault();return}setTimeout(()=>{S.sent=true;render(true)},400)}
  else if(a==='reset'){S.svc=null;S.day=null;S.time=null;S.sent=false;S.form.note='';S.form.health='';S.form.weeks='';render();window.scrollTo(0,0)}
});
render();

})();
</script>
</body>
</html>
