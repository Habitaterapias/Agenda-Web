function stepDia(){
  const m=S.month,t0=today0(),maxD=addDays(t0,90);
  const lead=(new Date(m.getFullYear(),m.getMonth(),1).getDay()+6)%7;
  const dim=new Date(m.getFullYear(),m.getMonth()+1,0).getDate();
  let cells='',anyFull=false;
  for(let i=0;i<lead;i++)cells+='<span></span>';
  for(let d=1;d<=dim;d++){
    const k=ymd(new Date(m.getFullYear(),m.getMonth(),d)),st=dayState(k);
    if(st==='full')anyFull=true;
    cells+='<button class="day" type="button" data-a="day" data-v="'+k+'"'+(st==='closed'?' disabled':'')+' aria-pressed="'+(S.day===k)+'"'+(st==='full'?' data-full="1"':'')+(ymd(t0)===k?' data-today="1"':'')+'>'+d+'</button>';
  }
  const prevOk=m>new Date(t0.getFullYear(),t0.getMonth(),1);
  const nextOk=new Date(m.getFullYear(),m.getMonth()+1,1)<=maxD;
  let slots='';
  if(S.day){
    const all=slotsAll(S.day,null,curDur()),nfree=all.filter(x=>x.free).length,anyBusy=all.some(x=>!x.free);
    slots='<div id="slots" style="scroll-margin-top:12px"><p class="dayh">'+esc(fmtDay(S.day))+'</p>'+
      (all.length?'<div class="slots">'+all.map(x=>x.free?'<button class="slot" type="button" data-a="time" data-v="'+x.h+'" aria-pressed="'+(S.time===x.h)+'">'+x.h+'</button>':'<button class="slot busy" type="button" data-a="busy" data-v="'+x.h+'" aria-pressed="'+(S.wlTime===x.h)+'" aria-label="'+x.h+', ocupado. Anotarme en la lista de espera"><s>'+x.h+'</s><span>Ocupado</span></button>').join('')+'</div>':'<p class="note">No quedan horarios ese día. Probá con otro.</p>')+
      (anyBusy?'<p class="legend">Los horarios tachados están ocupados. Tocá uno para anotarte en la lista de espera.</p>':'')+
      (nfree===0&&anyBusy?'<p class="note">Ese día está completo. Anotate en la lista de espera y te aviso si se libera un lugar.</p>':'')+
      (all.length?waitBox(nfree===0||!!S.wlTime):'')+'</div>';
  }
  return '<section class="step" id="s2" data-locked="'+(S.svc?0:1)+'" data-done="'+(S.time?1:0)+'"><div class="sh"><span class="num">2</span><h2>Día y horario</h2></div>'+
  '<div class="cal"><div class="calh"><button class="iconb" type="button" data-a="mon" data-v="-1" aria-label="Mes anterior"'+(prevOk?'':' disabled')+'>‹</button><strong>'+MONTHS[m.getMonth()]+' '+m.getFullYear()+'</strong><button class="iconb" type="button" data-a="mon" data-v="1" aria-label="Mes siguiente"'+(nextOk?'':' disabled')+'>›</button></div>'+
  '<div class="grid7">'+['L','M','M','J','V','S','D'].map(x=>'<span class="wd">'+x+'</span>').join('')+cells+'</div>'+(anyFull?'<p class="legend">Los días tachados están completos: podés anotarte en la lista de espera.</p>':'')+'</div>'+slots+'</section>';
}

function waitBanner(){

/* ---------- Clientas ---------- */
function people(){
  const m=new Map();
  const add=(x,doc)=>{
    if(!x.name||!String(x.name).trim())return;
    const k=pkey(x.name,x.phone),cur=m.get(k);
    if(!cur)m.set(k,{key:k,id:doc?x.id:'',doc:doc,name:String(x.name).trim(),phone:x.phone||'',note:doc?(x.note||''):''});
    else if(!cur.phone&&x.phone)cur.phone=x.phone;
  };
  S.clients.forEach(c=>add(c,true));
  S.bookings.forEach(b=>add(b,false));S.cups.forEach(c=>add(c,false));S.wait.forEach(w=>add(w,false));
  return Array.from(m.values());
}
function suggest(q){
  const nq=norm(q).trim(),qd=String(q||'').replace(/\D/g,'');
  if(nq.length<2)return [];
  const toks=nq.split(/\s+/).filter(Boolean);
  return people().filter(p=>{
    const words=norm(p.name).split(/\s+/);
    return toks.every(t=>words.some(w=>w.indexOf(t)===0))||(qd.length>=3&&(waPhone(p.phone).indexOf(qd)>=0||waPhone(p.phone).indexOf(qd.replace(/^0/,''))>=0));
  }).sort((a,b)=>(norm(b.name).indexOf(nq)===0)-(norm(a.name).indexOf(nq)===0)||a.name.localeCompare(b.name,'es')).slice(0,6);
}
function showSug(g,val){
  const box=document.querySelector('.sug[data-for="'+g+'"]');if(!box)return;
  const list=suggest(val);
  if(!list.length||(list.length===1&&norm(list[0].name)===norm(val).trim()&&GROUPS[g].phone)){box.hidden=true;box.innerHTML='';return}
  box.innerHTML=list.map(p=>'<button class="sugi" type="button" data-a="pick" data-g="'+g+'" data-k="'+esc(p.key)+'"><strong>'+esc(p.name)+'</strong><span>'+esc(p.phone||'sin WhatsApp')+'</span></button>').join('');
  box.hidden=false;
}
function pickClient(g,k){
  const p=people().find(x=>x.key===k),t=GROUPS[g];if(!p||!t)return;
  t.name=p.name;t.phone=p.phone||'';
  if(g==='nb'){const c=S.cups.find(c=>pkey(c.name,c.phone)===p.key&&cupUsed(c).length<c.total&&(!c.only||c.only===S.nb.svc));if(c)S.nb.type=c.id}
  render();
}
async function saveClient(name,phone){
  name=String(name||'').trim();phone=String(phone||'').trim();if(!name||!S.db)return;
  const k=pkey(name,phone),ex=S.clients.find(c=>pkey(c.name,c.phone)===k);
  try{
    if(!ex)await S.db.collection('clients').add({name:name,phone:phone,note:'',created:Date.now()});
    else if(phone&&!ex.phone)await S.db.collection('clients').doc(ex.id).update({phone:phone});
  }catch(e){}
}
function editClient(k){
  const p=people().find(x=>x.key===k);if(!p)return;
  S.cl.id=p.id;S.cl.key=p.key;S.cl.name=p.name;S.cl.phone=p.phone;S.cl.note=p.note;render();window.scrollTo(0,0);
}
async function saveClientForm(){
  const c=S.cl,name=c.name.trim(),phone=c.phone.trim(),note=c.note.trim();
  if(!name){toast('Escribí el nombre');return}
  try{
    if(c.id)await S.db.collection('clients').doc(c.id).update({name:name,phone:phone,note:note});
    else{
      const k=pkey(name,phone),ex=S.clients.find(x=>pkey(x.name,x.phone)===k);
      if(ex)await S.db.collection('clients').doc(ex.id).update({name:name,phone:phone,note:note});
      else await S.db.collection('clients').add({name:name,phone:phone,note:note,created:Date.now()});
    }

async function moveBooking(){
  const m=S.mv,b=S.bookings.find(x=>x.id===m.id);if(!b)return;

  const s=mins(m.t),du=dur(b.svc);

}

const monthOf=s=>String(s).slice(0,7);
function tabResumen(){
  const ym=S.sm,q=ym.split('-').map(Number),title=MONTHS[q[1]-1]+' '+q[0];
  const mine=S.bookings.filter(b=>monthOf(b.d)===ym),t0=ymd(new Date());
  const hecha=mine.filter(b=>b.st==='done'||b.st==='cobr');
  const ind=hecha.filter(b=>b.kind!=='cup'),cupS=hecha.filter(b=>b.kind==='cup');
  const price=b=>svcOf(b.svc).price;
  const incInd=ind.reduce((a,b)=>a+price(b),0);
  const sold=S.cups.filter(c=>monthOf(ymd(new Date(c.created||0)))===ym);
  const incCup=sold.reduce((a,c)=>a+(Number(c.price)||0),0);
  const sena=mine.filter(b=>b.st==='conf'&&b.kind!=='cup').reduce((a,b)=>a+Math.round(price(b)/2),0);
  const sin=mine.filter(b=>b.st==='conf'&&b.d<t0).length;
  const canc=mine.filter(b=>b.st==='canc').length,cobr=mine.filter(b=>b.st==='cobr').length;
  const by=SERVICES.map(s=>({s:s,n:hecha.filter(b=>b.svc===s.id).length})).filter(x=>x.n>0);
  const mx=Math.max.apply(null,[1].concat(by.map(x=>x.n)));
  const kv=(l,v,c)=>'<div class="kv'+(c?' '+c:'')+'"><span>'+l+'</span><b>'+v+'</b></div>';
  return '<div class="bar"><button class="iconb" type="button" data-a="smon" data-v="-1" aria-label="Mes anterior">‹</button><strong style="text-transform:capitalize">'+title+'</strong><button class="iconb" type="button" data-a="smon" data-v="1" aria-label="Mes siguiente">›</button></div>'+
  (sin?'<p class="note">Tenés '+sin+(sin===1?' turno pasado':' turnos pasados')+' sin marcar como realizados. Marcalos en Turnos para que cuenten acá.</p>':'')+
  '<section class="card"><h3>Ingresos</h3>'+kv('Sesiones individuales ('+ind.length+')',money(incInd))+kv('Cuponeras vendidas ('+sold.length+')',money(incCup))+kv('Total del mes',money(incInd+incCup),'tot')+
  (sena?'<p class="small" style="margin:0">Además hay '+money(sena)+' de señas de turnos confirmados que todavía no se realizaron.</p>':'')+'</section>'+
  '<section class="card"><h3>Sesiones</h3>'+kv('Realizadas',String(hecha.length))+kv('De cuponera',String(cupS.length))+kv('Canceladas sin cargo',String(canc))+kv('Canceladas con cobro',String(cobr))+
  (by.length?'<div style="display:grid;gap:10px;margin-top:4px">'+by.map(x=>'<div><div class="row"><span>'+esc(x.s.name)+'</span><b>'+x.n+'</b></div><div class="bar-prog"><i style="width:'+Math.round(x.n/mx*100)+'%"></i></div></div>').join('')+'</div>':'<p class="small" style="margin:0">Todavía no hay sesiones realizadas este mes.</p>')+'</section>';
}

/* ---------- Render y eventos ---------- */
function render(){
  const y=window.scrollY;
  app.innerHTML='<div class="wrap'+(S.view==='panel'?' wide':'')+'">'+(S.view==='panel'?panelView():clientView())+'</div>';
  window.scrollTo(0,y);
}
let pending=false;
function typing(){const a=document.activeElement;return !!(a&&app.contains(a)&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)&&a.type!=='checkbox')}
function rr(){if(typing()){pending=true;return}render()}
let tt;
function toast(m){let el=$('#toast');if(!el){el=document.createElement('div');el.id='toast';el.setAttribute('role','status');document.body.appendChild(el)}el.textContent=m;el.className='show';clearTimeout(tt);tt=setTimeout(()=>{el.className=''},3200)}
function goto(id){const el=document.getElementById(id);if(el){const rm=window.matchMedia('(prefers-reduced-motion: reduce)').matches;el.scrollIntoView({behavior:rm?'auto':'smooth',block:'start'})}}
function refreshCta(){const a=$('#cta');if(!a)return;const c=ctaState();a.setAttribute('href',c.href);a.setAttribute('aria-disabled',c.ok?'false':'true')}
function refreshWl(){const st=wlState(),a=$('#wcta');if(!a)return;a.setAttribute('href',st.href);a.setAttribute('aria-disabled',st.ok?'false':'true')}
function refreshCancel(){const st=cancelState(),m=$('#cmsg'),a=$('#ccta');if(!m||!a)return;m.textContent=st.msg;m.hidden=!st.msg;a.setAttribute('href',st.href);a.setAttribute('aria-disabled',st.ok?'false':'true')}
const GROUPS={f:S.form,c:S.cancel,nb:S.nb,nc:S.nc,bl:S.bl,w:S.wl,nw:S.nw,cl:S.cl,mv:S.mv};
function field(e){
  const id=e.target.id||'',i=id.indexOf('-');if(i<0)return false;
  const g=GROUPS[id.slice(0,i)];if(!g)return false;
  g[id.slice(i+1)]=e.target.type==='checkbox'?e.target.checked:e.target.value;return id.slice(0,i);
}
app.addEventListener('input',e=>{
  const g=field(e);if(g==='f')refreshCta();else if(g==='c')refreshCancel();else if(g==='w')refreshWl();
  const id=e.target.id||'';
  if(id==='nb-name'||id==='nw-name'||id==='nc-name')showSug(id.slice(0,2),e.target.value);
  else if(id==='cl-q'){const el=$('#cl-list');if(el)el.innerHTML=clList()}
});
if(document.addEventListener)document.addEventListener('click',e=>{if(!e.target.closest('.sug')&&!/-name$/.test(e.target.id||''))document.querySelectorAll('.sug').forEach(x=>{x.hidden=true})});
app.addEventListener('change',e=>{
  const g=field(e);if(!g)return;
  if(g==='f')refreshCta();else if(g==='c')refreshCancel();else if(g==='w')refreshWl();
  else if(e.target.id==='nb-type'&&S.nb.type!=='suelta'){const c=S.cups.find(x=>x.id===S.nb.type);if(c){S.nb.name=c.name;S.nb.phone=c.phone||''}render()}
  else if(e.target.id==='nc-pack'){const pk=PACKS.find(x=>x.id===S.nc.pack);if(pk){S.nc.total=String(pk.total);S.nc.price=String(pk.price)}render()}
  else if(e.target.id==='nb-svc'){const cc=S.cups.find(x=>x.id===S.nb.type);if(cc&&cc.only&&cc.only!==S.nb.svc)S.nb.type='suelta';render()}
  else if(e.target.id==='bl-from'){if(mins(S.bl.to)<=mins(S.bl.from))S.bl.to=hhmm(Math.min(mins(S.bl.from)+60,20*60));render()}
});
app.addEventListener('toggle',e=>{if(e.target.id==='cdet')S.cancelOpen=e.target.open;else if(e.target.id==='wdet')S.wlOpen=e.target.open},true);
app.addEventListener('focusout',()=>{if(pending)setTimeout(()=>{if(!typing()){pending=false;render()}},60)});
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||!app.contains(b))return;
  const a=b.dataset.a,v=b.dataset.v,id=b.dataset.id;
  if(a==='sent'){if(b.getAttribute('aria-disabled')==='true'){e.preventDefault();toast('Completá tu nombre y tu WhatsApp');return}S.sent=true;setTimeout(render,80);return}
  if(a==='wl'){if(b.getAttribute('aria-disabled')==='true'){e.preventDefault();toast('Completá tu nombre y tu WhatsApp');return}toast('Se abrió WhatsApp con tu pedido.');return}
  if(a==='rem'){upd(id,{[b.dataset.f]:b.checked});return}
  if(a==='svc'){S.svc=v;if(S.day&&S.time&&!slotsFor(S.day,null,dur(v)).includes(S.time))S.time=null;S.wlTime=null;S.sent=false;render();goto('s2')}
  else if(a==='mon'){S.month=new Date(S.month.getFullYear(),S.month.getMonth()+Number(v),1);render()}
  else if(a==='day'){S.day=v;S.time=null;S.wlTime=null;S.sent=false;render();goto('slots')}
  else if(a==='time'){S.time=v;S.sent=false;render();goto('s3')}
  else if(a==='kind'){S.form.kind=v;render()}
  else if(a==='first'){S.form.first=v;render()}
  else if(a==='busy'){S.wlTime=S.wlTime===v?null:v;S.wlOpen=true;render();goto('wdet')}
  else if(a==='wlclear'){S.wlTime=null;render()}
  else if(a==='reset'){S.svc=null;S.day=null;S.time=null;S.sent=false;S.form.note='';render();window.scrollTo(0,0)}
  else if(a==='view'){S.view=v;render();window.scrollTo(0,0)}
  else if(a==='tab'){S.tab=v;render()}
  else if(a==='blmode'){S.bl.all=v==='day';render()}
  else if(a==='mv'){const bk=S.bookings.find(x=>x.id===id);if(bk){S.mv.id=id;S.mv.d=bk.d;S.mv.t=bk.t;render()}}
  else if(a==='mvsave')moveBooking();
  else if(a==='mvcancel'){S.mv.id='';render()}
  else if(a==='smon'){const q=S.sm.split('-').map(Number),d=new Date(q[0],q[1]-1+Number(v),1);S.sm=d.getFullYear()+'-'+pad(d.getMonth()+1);render()}
  else if(a==='cx'){S.cancelId=S.cancelId===id?null:id;render()}
  else if(a==='st'){S.cancelId=null;upd(id,{st:b.dataset.s});if(b.dataset.s==='done')toast('Realizada. El mensaje de seguimiento queda en Recordatorios.')}
  else if(a==='del'){S.db.collection('bookings').doc(id).delete().catch(fail)}
  else if(a==='delc'){if(S.bookings.some(x=>x.cup===id)){toast('Esa cuponera tiene turnos. Cancelalos primero.');return}S.db.collection('cups').doc(id).delete().catch(fail)}
  else if(a==='delbl'){S.db.collection('blocks').doc(id).delete().catch(fail)}
  else if(a==='addb')addBooking();
  else if(a==='addc')addCup();
  else if(a==='addbl')addBlock();
  else if(a==='addw')addWait();
  else if(a==='pick')pickClient(b.dataset.g,b.dataset.k);
  else if(a==='cledit')editClient(b.dataset.k);
  else if(a==='cldel'){S.db.collection('clients').doc(id).delete().catch(fail)}
  else if(a==='clsave')saveClientForm();
  else if(a==='clcancel'){S.cl.id='';S.cl.key='';S.cl.name='';S.cl.phone='';S.cl.note='';render()}
  else if(a==='delw'){S.db.collection('wait').doc(id).delete().catch(fail)}
  else if(a==='give')giveTurn(id,v);
  else if(a==='publish')publish();
});
function fail(e){toast(e&&e.code==='invalid_argument'?'No tenés permiso para guardar cambios.':'No se pudo guardar. Probá de nuevo.')}
function upd(id,d){return S.db.collection('bookings').doc(id).update(d).catch(fail)}
async function addBooking(){
  const f=S.nb;
  if(!f.name.trim()||!f.d||!f.t){toast('Completá nombre, día y hora');return}
  const k=f.d,s=mins(f.t);
  const du=dur(f.svc);
  if(S.bookings.some(b=>act(b)&&b.d===k&&s<mins(b.t)+dur(b.svc)&&s+du>mins(b.t))){toast('Ese horario se pisa con otro turno');return}
  const cup=f.type!=='suelta';
  try{
    await S.db.collection('bookings').add({name:f.name.trim(),phone:f.phone.trim(),svc:f.svc,d:f.d,t:f.t,kind:cup?'cup':'suelta',cup:cup?f.type:null,st:cup?'conf':'pend',rem1:false,rem0:false,created:Date.now()});
    saveClient(f.name,f.phone);
    S.nb.name='';S.nb.phone='';S.nb.type='suelta';toast('Turno guardado');render();
  }catch(e){fail(e)}
}
async function addCup(){
  const f=S.nc,n=Number(f.total);
  if(!f.name.trim()||!(n>=1&&n<=50)){toast('Completá el nombre y la cantidad de sesiones');return}
  try{await S.db.collection('cups').add({name:f.name.trim(),phone:f.phone.trim(),total:Math.round(n),price:Math.max(0,Number(f.price)||0),pack:f.pack,only:(PACKS.find(x=>x.id===f.pack)||{only:''}).only,created:Date.now()});saveClient(f.name,f.phone);S.nc.name='';S.nc.phone='';toast('Cuponera creada');render()}catch(e){fail(e)}
}
async function addBlock(){
  const f=S.bl;if(!f.d){toast('Elegí el día');return}
  const from=f.all?'00:00':f.from,to=f.all?'24:00':f.to;
  if(mins(to)<=mins(from)){toast('La hora final tiene que ser después de la inicial');return}
  try{await S.db.collection('blocks').add({d:f.d,from,to,note:f.note.trim(),created:Date.now()});S.bl.note='';const clash=S.bookings.some(b=>act(b)&&b.d===f.d&&mins(b.t)<mins(to)&&mins(b.t)+dur(b.svc)>mins(from));toast(clash?'Bloqueo guardado. Ojo: ya hay un turno en ese horario.':'Bloqueo guardado');render()}catch(e){fail(e)}
}
function buildDoc(pub){
  const css=$('#st').textContent,code=$('#code').textContent;
  const json=JSON.stringify(pub).replace(/</g,'\\u003c');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'+
    HEAD+'<style id="st">'+css+'</style><div id="app"></div><script type="application/json" id="pub">'+json+'</'+'script><script id="code">'+code+'</'+'script></body></html>';
}
async function publish(){
  const art=await window.claude.use('artifact');
  if(!art){toast('Desde acá no se puede publicar.');return}
  const p=payload();
  try{await art.publish(buildDoc({taken:p.taken,blocks:p.blocks,updated:new Date().toISOString()}));toast('Horarios publicados')}
  catch(e){toast(e&&e.code==='conflict'?'Se actualizó la página. Probá de nuevo.':'No se pudo publicar. Probá de nuevo.')}
}
function watch(name,key){
  S.db.collection(name).onSnapshot(snap=>{
    S[key]=snap.docs.map(d=>Object.assign({id:d.id},d.data()));
    if(!snap.metadata.fromCache)S.ready[key]=true;
    rr();
  },()=>{S.ready[key]=false;rr()});
}
render();
(async()=>{
  try{
    if(!window.claude||!window.claude.use)return;
    const user=await window.claude.use('user');
    if(!user||!(await user.isOwner()))return;
    S.owner=true;render();
    S.db=await window.claude.use('db');
    if(S.db){watch('bookings','bookings');watch('blocks','blocks');watch('cups','cups');watch('wait','wait');watch('clients','clients')}
  }catch(e){}
})();
})();
</script>
